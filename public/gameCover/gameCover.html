<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICEbreaker</title>
  <link id="link-fonts" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gameCover/gameCover.css">
  <link id="link-bootstrap-icons" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <script src="/js/offlineResolver.js"></script>
</head>
<body>
  <style>body { visibility: hidden; }</style>

  <div class="bg">
    <div class="bg-base"></div>
    <canvas id="matrix-rain" class="bg-matrix"></canvas>
    <div class="bg-grid"></div>
    <div class="bg-noise" id="noise"></div>
    <div class="bg-scanlines"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="h-accent top"></div>
  <div class="h-accent bottom"></div>
  <div class="side-text left">SYS://NETWORK INTRUSION PROTOCOL v4.7</div>
  <div class="side-text right">CLASSIFICATION: ULTRA-BLACK // AUTHORIZED ONLY</div>

  <main class="content" id="layout">
    <div class="top-bar">
      <div class="top-bar-line"></div>
      <span class="top-bar-text">ICEbreaker Root</span>
      <div class="top-bar-line right"></div>
    </div>

    <div class="logo-wrap">
      <h1 class="logo"><span class="ice">ICE</span><span class="breaker">breaker</span></h1>
    </div>

    <div class="subtitle">Breach the Grid</div>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
      <button class="nav-item" data-href="/singlePlayer" aria-label="Single Player"><span class="nav-arrow">▶</span><span class="nav-label">SINGLE PLAYER</span></button>
      <button class="nav-item" data-href="/multiPlayer" aria-label="Multiplayer"><span class="nav-arrow">▶</span><span class="nav-label">MULTIPLAYER</span></button>
      <button class="nav-item" id="btn-account" aria-label="Account"><span class="nav-arrow">▶</span><span class="nav-label">ACCOUNT</span></button>
      <button class="nav-item" id="btn-settings" aria-label="Settings"><span class="nav-arrow">▶</span><span class="nav-label">SETTINGS</span></button>
    </nav>

    <div class="data-row">
      <div class="data-item"><span class="data-label">Protocol</span><span class="data-value">BLACK ICE</span></div>
      <div class="data-sep"></div>
      <div class="data-item"><span class="data-label">Threat Level</span><span class="data-value">CRITICAL</span></div>
      <div class="data-sep"></div>
      <div class="data-item"><span class="data-label">Node Status</span><span class="data-value">EXPOSED</span></div>
    </div>

    <div class="press-start">[ Select Protocol ]</div>
  </main>

  <div id="settings-div" style="display: none;">
    <div id="settings">
      <div class="cy-h1">Settings</div>
      <div class="settings-option"><div class="cy-btn"><label for="fx-volume-slider">FX Volume</label><input type="range" min="0" max="1" value="0.5" step="0.01" class="slider" id="fx-volume-slider"></div></div>
      <div class="settings-option"><div class="cy-btn"><label for="bg-volume-slider" class="cy-text-cyan">Background Volume</label><input type="range" min="0" max="1" value="0.5" step="0.01" class="slider" id="bg-volume-slider"></div></div>
      <div class="settings-option"><button class="cy-btn" id="mute-button">Mute <span id="mute-icon"><i class="bi bi-volume-up cy-text-magenta"></i></span></button><button class="cy-btn" id="defaults-button">Revert to Defaults</button><button class="cy-btn" id="graphics-button">Graphics: <span id="graphics-value" class="cy-text-magenta">Normal</span></button></div>
      <div class="settings-option"><button class="cy-btn--magenta" id="close-settings-button">Close</button></div>
    </div>
  </div>

  <script src="/gameCover/gameCover.js" type="module"></script>
</body>
</html>
